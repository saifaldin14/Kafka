# The cargo-fuzz targets (docs/standards/testing.md), one per decoder. This is its own
# workspace, which the main one excludes, so that only this one builds libFuzzer and it
# can use the nightly toolchain pinned in rust-toolchain.toml. Run a target with
# `cargo xtask fuzz` (README.md).
[package]
name = "alluvium-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license-file = "../LICENSE"

[package.metadata]
cargo-fuzz = true

# `generated` holds the fuzz targets `cargo xtask codegen` writes, one per message.
[workspace]
members = [".", "generated"]

[dependencies]
alluvium-protocol = { path = "../crates/alluvium-protocol" }
alluvium-types = { path = "../crates/alluvium-types" }
bytes = { version = "1.12.2", default-features = false, features = ["std"] }
libfuzzer-sys = "0.4.13"
peak_alloc = { version = "0.3.0", default-features = false }

[[bin]]
name = "protocol_wire_primitives"
path = "fuzz_targets/protocol_wire_primitives.rs"
test = false
doc = false
bench = false

[[bin]]
name = "types_topic_name"
path = "fuzz_targets/types_topic_name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "types_uuid_parse"
path = "fuzz_targets/types_uuid_parse.rs"
test = false
doc = false
bench = false
