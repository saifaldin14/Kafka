# Every check is a step of `cargo xtask ci` (xtask/src/ci.rs); jobs only choose which
# steps run where. The exceptions are fuzzing, which runs `cargo xtask fuzz` per
# hand-written target and per shard of generated targets (fuzz/README.md), and the gated benchmarks, which need valgrind (ADR-0019). Security defaults (docs/standards/security.md#dependencies):
# no permissions unless a job asks, actions pinned to full commit SHAs, no persisted
# checkout credentials, and a timeout on every job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt, clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask-ci
        with:
          steps: fmt clippy

  policy:
    name: policy (layers, manifests, schemas, codegen, workflows, backlog, lint canary)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask-ci
        with:
          steps: layers manifests schemas codegen workflows backlog lint-canary

  docs:
    name: docs (rustdoc, links, crate deep dives)
    # Linux only: rustdoc output and Markdown links don't depend on the platform.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask-ci
        with:
          steps: doc crate-docs links

  deny:
    name: deny (bans, licenses, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask-ci
        with:
          steps: deny fuzz-deny
      # A reviewer aid, not a check (FND-0016): lists the crates a PR adds, removes or
      # upgrades, with license and transitive count, in this job's summary.
      - name: Dependency changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          if git diff --quiet "origin/$BASE_REF" HEAD -- Cargo.lock; then
            echo "Cargo.lock is unchanged."
          else
            cargo xtask deps-diff "origin/$BASE_REF" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  advisories:
    name: advisories (non-blocking)
    # A new advisory depends on the date, not on the change, so it must not block
    # unrelated PRs: this job is not in ci-success's `needs`, and its failure doesn't
    # fail the run. advisories.yml checks daily and tracks failures in an issue.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask-ci
        with:
          steps: advisories

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Runner images pinned by label, never `-latest`.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/xtask-ci
        with:
          steps: test doctest
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  fuzz-targets:
    name: fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: List the targets
        id: list
        run: echo "targets=$(cargo xtask fuzz --list | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz (${{ matrix.target }})
    # Each target for 60 s from the corpus the nightly run grew (ADR-0018). A crash
    # fails the PR and its input is uploaded: `cargo xtask fuzz <target> <input>`
    # reproduces it.
    needs: fuzz-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchains
        run: |
          rustup toolchain install --profile minimal
          cd fuzz && rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "true"
      - name: Install cargo-fuzz
        run: cargo xtask tools install --tool cargo-fuzz
      - name: Pull the corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask fuzz corpus pull "$TARGET"
      - name: Fuzz
        run: cargo xtask fuzz "$TARGET" --time 60s
      - name: Upload the crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14

  fuzz-generated:
    name: fuzz generated (shard ${{ matrix.shard }}/8)
    # The generated targets, one per message (PROTO-F11), in 8 shards: each builds its
    # share and fuzzes each target for 10 s from its golden vectors. They keep no corpus
    # (ADR-0018). A crash fails the PR, and every crash input of the shard is uploaded.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchains
        run: |
          rustup toolchain install --profile minimal
          cd fuzz && rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: generated-${{ matrix.shard }}
          workspaces: |
            . -> target
            fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "true"
      - name: Install cargo-fuzz
        run: cargo xtask tools install --tool cargo-fuzz
      # The allocation oracle's own test (PROTO-0134), once.
      - name: Test the fuzz harness
        if: ${{ matrix.shard == 1 }}
        working-directory: fuzz
        run: cargo test --lib --locked
      - name: Fuzz
        run: cargo xtask fuzz --shard "$SHARD/8"
      - name: Upload the crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-generated-${{ matrix.shard }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  bench:
    name: bench (instruction counts)
    # The gated benchmarks at the base and at this commit, in one job: instruction counts
    # are exact but differ between machines' architectures (ADR-0019). A count that grows
    # beyond its threshold in benches/thresholds.toml fails the job; the comparison is in
    # the job summary.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and valgrind
        run: |
          rustup toolchain install --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "true"
      - name: Install gungraun-runner
        run: cargo xtask tools install --tool gungraun-runner
      - name: Fetch the base commit
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Compare with the base
        run: cargo xtask bench --base "$BASE_SHA"

  ci-success:
    name: ci-success
    # The single required status check. Every job that must pass is in `needs`: add a
    # new required job here. `advisories` is deliberately left out.
    if: always()
    needs: [lint, policy, docs, deny, test, fuzz-targets, fuzz, fuzz-generated, bench]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result != "success")' > /dev/null; then
            echo "A required job failed, was cancelled or was skipped."
            exit 1
          fi
