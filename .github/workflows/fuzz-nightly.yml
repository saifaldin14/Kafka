# Nightly fuzzing (fuzz/README.md, ADR-0018). Each target fuzzes for an hour from the
# corpus earlier runs grew. On main, the grown corpus is uploaded as the artifact PR runs
# and `cargo xtask fuzz corpus pull` start from. On Sundays, or when asked, each corpus
# is minimized first.
#
# A crash opens one issue per target, or comments on the open one. The jobs that run
# the targets can't write anything; only `report`, which never runs repository code,
# may write issues.
name: Fuzz nightly

on:
  schedule:
    - cron: "23 2 * * 1-6"
    - cron: "23 2 * * 0" # Sundays: minimize too
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        type: number
        default: 3600
      minimize:
        description: Minimize each corpus before uploading it
        type: boolean
        default: false

permissions: {}

# One run at a time per branch, never cancelled: two runs starting from the same corpus
# would each upload only their own discoveries.
concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  targets:
    name: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: List the targets
        id: list
        run: echo "targets=$(cargo xtask fuzz --list | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      TARGET: ${{ matrix.target }}
      SECONDS_PER_TARGET: ${{ inputs.seconds || 3600 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchains
        run: |
          rustup toolchain install --profile minimal
          cd fuzz && rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "true"
      - name: Install cargo-fuzz
        run: cargo xtask tools install --tool cargo-fuzz
      - name: Pull the corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask fuzz corpus pull "$TARGET"
      # A crash must not stop the corpus and the crash input from being uploaded; the
      # last step fails the job instead.
      - name: Fuzz
        id: fuzz
        continue-on-error: true
        run: cargo xtask fuzz "$TARGET" --time "${SECONDS_PER_TARGET}s"
      - name: Minimize the corpus
        if: ${{ github.event.schedule == '23 2 * * 0' || inputs.minimize }}
        run: cargo xtask fuzz corpus minimize "$TARGET"
      - name: Upload the corpus
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload the crash input
        if: ${{ steps.fuzz.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 90
      # The issue text, written here because only this job has the crash input. It
      # inlines an input of up to 4 KiB, so the issue outlives the artifact.
      - name: Write the crash report
        if: ${{ steps.fuzz.outcome == 'failure' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p report
          input=$(find "fuzz/artifacts/$TARGET" -type f 2>/dev/null | sort | head -n 1)
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' fuzz/rust-toolchain.toml)
          {
            echo "The nightly fuzz run found a crash in \`$TARGET\`."
            echo
            echo "- Run: $RUN_URL"
            echo "- Commit: $COMMIT"
            echo "- Toolchain: $toolchain; limits as in fuzz/README.md at that commit"
            if [ -z "$input" ]; then
              echo "- Input: none was written (a build or setup failure?); see the run log"
            else
              echo "- Input: \`$(basename "$input")\`, in the run's \`fuzz-crash-$TARGET\` artifact (kept 90 days)"
              if [ "$(wc -c < "$input")" -le 4096 ]; then
                echo
                echo "The input, base64-encoded:"
                echo
                echo '```'
                base64 -w 76 "$input"
                echo '```'
              fi
            fi
            echo
            echo "Reproduce it: save the input, then run \`cargo xtask fuzz $TARGET <input>\`."
            echo "Triage it as docs/guides/debugging.md#fuzz-crashes says: a failing unit test in the owning crate, the fix, and the input in fuzz/seeds/$TARGET/."
          } > "report/$TARGET.md"
      - name: Upload the crash report
        if: ${{ steps.fuzz.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-report-${{ matrix.target }}
          path: report/
          retention-days: 7
      - name: Fail if the target crashed
        if: ${{ steps.fuzz.outcome == 'failure' }}
        run: |
          echo "$TARGET crashed; the input is in the fuzz-crash-$TARGET artifact."
          exit 1

  report:
    name: report crashes
    # Reads the reports the fuzz jobs wrote and opens or updates one issue per crashing
    # target. It checks out no code and runs nothing from the repository.
    needs: fuzz
    if: ${{ always() && needs.fuzz.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-report-*
          path: reports
          merge-multiple: true
      - name: Open or update one issue per crashing target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          for report in reports/*.md; do
            target=$(basename "$report" .md)
            title="Fuzz crash: $target"
            # Search narrows the list; the exact title decides.
            number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file "$report"
            else
              gh issue create --title "$title" --body-file "$report"
            fi
          done
