# Dependency updates as separate PRs (docs/standards/security.md#dependencies).
# Each update is its own PR: no groups.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  # Actions are pinned to commit SHAs (cargo xtask check-workflows); Dependabot bumps
  # the SHA and keeps the `# vX.Y.Z` comment in step with it.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    labels:
      - dependencies

  # The devcontainer: its base image is pinned by digest in the Dockerfile (`docker`),
  # and its features by major version in devcontainer.json (`devcontainers`).
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
