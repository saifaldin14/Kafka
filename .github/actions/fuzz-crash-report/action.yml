name: Fuzz crash report
description: >-
  Writes report/<target>.md for each target with a crash input in fuzz/artifacts/, the
  issue text the nightly fuzz run's `report` job posts, and uploads report/ as the
  fuzz-report-<name> artifact. A failure that wrote no input, such as a build error, gets
  one report under the given name.

inputs:
  name:
    description: The job's name for its artifacts, such as the target or `generated-3`.
    required: true

runs:
  using: composite
  steps:
    # It inlines an input of up to 4 KiB, so the issue outlives the artifact.
    - name: Write the crash reports
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        COMMIT: ${{ github.sha }}
      run: |
        mkdir -p report
        toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' fuzz/rust-toolchain.toml)
        report() {
          local target=$1 input=$2
          echo "The nightly fuzz run found a crash in \`$target\`."
          echo
          echo "- Run: $RUN_URL"
          echo "- Commit: $COMMIT"
          echo "- Toolchain: $toolchain; limits as in fuzz/README.md at that commit"
          if [ -z "$input" ]; then
            echo "- Input: none was written (a build or setup failure?); see the run log"
          else
            echo "- Input: \`$(basename "$input")\`, in the run's \`fuzz-crash-$NAME\` artifact (kept 90 days)"
            if [ "$(wc -c < "$input")" -le 4096 ]; then
              echo
              echo "The input, base64-encoded:"
              echo
              echo '```'
              base64 -w 76 "$input"
              echo '```'
            fi
          fi
          echo
          echo "Reproduce it: save the input, then run \`cargo xtask fuzz $target <input>\`."
          echo "Triage it as docs/guides/debugging.md#fuzz-crashes says: a failing unit test in the owning crate, the fix, and the input in fuzz/seeds/$target/."
        }
        for dir in fuzz/artifacts/*/; do
          input=$(find "$dir" -type f 2>/dev/null | sort | head -n 1)
          if [ -n "$input" ]; then
            target=$(basename "$dir")
            report "$target" "$input" > "report/$target.md"
          fi
        done
        if [ -z "$(ls report)" ]; then
          report "$NAME" "" > "report/$NAME.md"
        fi
    - name: Upload the crash reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-report-${{ inputs.name }}
        path: report/
        retention-days: 7
