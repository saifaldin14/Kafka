name: cargo xtask ci
description: >-
  Installs the toolchain pinned in rust-toolchain.toml, restores the cache, installs
  the tools the given steps need, then runs those `cargo xtask ci` steps. Every CI job runs its checks through
  this action, so each check is defined once, in xtask/src/ci.rs.

inputs:
  steps:
    description: Space-separated `cargo xtask ci` step names (`cargo xtask ci --list` shows them).
    required: true
  log:
    description: If set, a file that also receives the steps' output, for a later step to read.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      # With no name, rustup installs the toolchain and components from rust-toolchain.toml.
      run: rustup toolchain install --profile minimal

    - name: Restore the cache (dependencies, build output, installed tools)
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # Keyed on the job, OS, toolchain and Cargo.lock. Only pushes to main save, so
        # a PR can never write the cache main restores (cache poisoning).
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-bin: "true"

    - name: Install the tools the steps need
      shell: bash
      env:
        CI_STEPS: ${{ inputs.steps }}
      run: |
        args=()
        for step in $CI_STEPS; do args+=(--step "$step"); done
        cargo xtask tools install "${args[@]}"

    - name: Run the steps
      shell: bash
      env:
        CI_STEPS: ${{ inputs.steps }}
        CI_LOG: ${{ inputs.log }}
      run: |
        args=(--keep-going)
        for step in $CI_STEPS; do args+=(--step "$step"); done
        if [ -n "$CI_LOG" ]; then
          set -o pipefail
          cargo xtask ci "${args[@]}" 2>&1 | tee "$CI_LOG"
        else
          cargo xtask ci "${args[@]}"
        fi
