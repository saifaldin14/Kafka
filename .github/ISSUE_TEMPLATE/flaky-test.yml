name: Flaky test
description: A test that passed and failed without a code change. Flaky tests are bugs (testing.md rule 7).
labels: [flaky, test]
body:
  - type: markdown
    attributes:
      value: |
        A flaky test may be quarantined with `#[ignore = "flaky: #<this issue>"]` only while this issue is open, and must be fixed within the milestone. CI never retries tests, so this failure is real ([testing standard](https://github.com/saifaldin14/Kafka/blob/main/docs/standards/testing.md#rules)).
  - type: input
    id: test
    attributes:
      label: Test name
      description: The full nextest name, for example `alluvium-raft::sim_election leader_is_unique`.
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Failing run
      description: Link to the CI run, or the machine and OS it failed on.
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Seed
      description: The seed it printed, if it is a simulation or property test. Replay with `ALLUVIUM_SIM_SEED=<seed> cargo nextest run <test>`.
  - type: textarea
    id: failure
    attributes:
      label: Failure output
      render: text
    validations:
      required: true
  - type: dropdown
    id: quarantine
    attributes:
      label: Quarantine
      options:
        - Not quarantined
        - 'Quarantined with `#[ignore = "flaky: #<this issue>"]`'
    validations:
      required: true
