version = "1.0.228"
source = "registry+https://github.com/rust-lang/crates.io-index"
dependencies = [
 "syn",
]

[[package]]
name = "syn"
version = "2.0.100"
source = "registry+https://github.com/rust-lang/crates.io-index"
dependencies = [
 "unicode-ident",
]

[[package]]
name = "tools"
version = "0.1.0"

[[package]]
name = "unicode-ident"
version = "1.0.18"
source = "registry+https://github.com/rust-lang/crates.io-index"
